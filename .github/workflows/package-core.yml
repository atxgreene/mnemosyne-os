name: Package authoritative Mnemosyne core

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/package-core.yml'
      - 'docs/adr/0002-authoritative-core-package.md'
      - 'packaging/arch/**'
      - 'packaging/systemd/user/**'
      - 'tests/test_core_package_contract.py'
      - 'tests/test_core_supply_chain.py'
      - 'upstream/mnemosyne-core.lock.json'
      - 'upstream/NOTICE-MNEMOSYNE-CORE.md'
      - 'README.md'
      - 'requirements.in'
      - 'requirements.txt'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - '.github/workflows/package-core.yml'
      - 'docs/adr/0002-authoritative-core-package.md'
      - 'packaging/arch/**'
      - 'packaging/systemd/user/**'
      - 'tests/test_core_package_contract.py'
      - 'tests/test_core_supply_chain.py'
      - 'upstream/mnemosyne-core.lock.json'
      - 'upstream/NOTICE-MNEMOSYNE-CORE.md'
      - 'README.md'
      - 'requirements.in'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  contracts:
    name: Contract and full tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install locked test dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Run authoritative-core contracts
        run: python -m pytest tests/test_core_package_contract.py tests/test_core_supply_chain.py -q

      - name: Run full test suite
        run: python -m pytest tests -q

  arch-package:
    name: Build and smoke-test Arch package
    needs: contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build, install, and smoke-test in pinned Arch container
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace" \
            archlinux:base@sha256:f3691b4dde62ba4c4b6f0ae2c1fbf28e8c0c8c4b9a35c7e06dc1f70e21aa29f6 \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed \
                base-devel curl python python-build python-installer python-setuptools
              useradd --create-home builder
              mkdir -p /build/repo
              cp -a /workspace/. /build/repo/
              chown -R builder:builder /build/repo
              su builder -s /bin/bash -c \
                "cd /build/repo/packaging/arch && makepkg --cleanbuild --noconfirm"
              packages=(/build/repo/packaging/arch/mnemosyne-core-*.pkg.tar.zst)
              test "${#packages[@]}" -eq 1
              pacman -U --noconfirm "${packages[0]}"
              bash /build/repo/packaging/arch/smoke-test.sh
              mkdir -p /workspace/dist/core-package
              cp "${packages[0]}" /workspace/dist/core-package/
            '

      - name: Upload short-lived package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mnemosyne-core-arch-package
          path: dist/core-package/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 7
